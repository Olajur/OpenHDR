; OpenHDR settings. Lives in %LOCALAPPDATA%\OpenHDR\OpenHDR.ini (copied there on first run).
; Values here are the defaults for every game; the in-game panel (Alt+1) saves per-game
; overrides to %LOCALAPPDATA%\OpenHDR\games\<game>.exe.ini. Changes apply while games run.
;
; Hotkeys (game focused), changeable in [Hotkeys] below or in the main window:
;   Alt+1           settings panel (arrow keys: select / adjust)
;   Alt+2           toggle HDR conversion (off = plain SDR shown at paper white)
;   Alt+3           split-screen compare (left: plain SDR, right: converted)
;   Ctrl+Shift+F11  dump the current input/output frame to the dumps folder

[OpenHDR]
; Global switch, also toggled from the tray icon. 0 = OpenHDR does not touch newly started games
; (use this when you want Windows Auto HDR instead); running games switch to plain SDR output.
Enabled=1
; Upgrade even when Windows HDR is not detected on the game's display (testing only).
ForceHDR=0
; Look of the tray panel and installer: system (follow Windows), light or dark. Also set from the panel.
Theme=system

; Display peak brightness in nits. 0 = read it from the display through DXGI.
PeakBrightness=0
; Output brightness of SDR 18% grey in nits (midtones).
; Paper white (SDR 100% white before expansion) = MiddleGrey / 0.18.
MiddleGrey=50
; Paper white in nits; overrides MiddleGrey when > 0 (the panel's Middle grey slider then has no effect).
PaperWhite=0
; Contrast and saturation: -100..+100, 0 = the default look.
; Contrast sets the SDR decoding gamma: 0 = 2.0, +25 = 2.2, +50 = 2.4, -25 = 1.8.
ContrastLevel=0
; Saturation: 0 = +5% (the default look), -25 = neutral, +100 = +25%.
SaturationLevel=0
; Smooths visible steps in SDR gradients (skies, fog) before they are expanded: off, low or high.
Debanding=off
; Injected mode's output: auto or scrgb (FP16, the most precise), or hdr10 (10-bit PQ).
OutputFormat=auto
; Adapts the conversion to the scene, measured on a downscaled copy of every frame (0 = off, 1 = full):
; large bright areas (sky, snow, menus) get less highlight headroom so they don't glare, and dark
; scenes start the expansion lower so lamps and fire stand out. Changes are smoothed over time.
SceneAdaptation=1
; Debug: log the scene statistics and adjustments every frame.
SceneDebug=0

; Linear SDR luminance (0..1) where highlight expansion starts. Everything darker stays as in SDR.
ShoulderStart=0.25
; Steepness of the highlight expansion (>= 1). Higher keeps more of the image near SDR and
; concentrates the boost in the brightest parts.
ExpansionPower=2.0
; 0 = expand each channel separately (bright highlights desaturate toward white),
; 1 = expand luminance only (highlights keep their colour).
HighlightSaturation=0.5

; Base curve the contrast gamma applies to: gamma (pure power curve) or srgb (piecewise sRGB).
InputTransfer=gamma22
; Dither strength in input code values; hides banding that highlight expansion amplifies. 0 = off.
Dither=1.0

; Split position for the compare view, 0..1 of the screen width.
CompareSplit=0.5
; Debug: automatically dump input/output once this many frames have been presented (0 = off).
DumpFrame=0

[Hotkeys]
; Key combinations like Alt+1, Ctrl+Shift+F9, Alt+Num1 or None. Modifiers: Ctrl, Alt, Shift, Win.
Panel=Alt+1
Conversion=Alt+2
Compare=Alt+3
Dump=Ctrl+Shift+F11

; Games OpenHDR is active in: the exe file name (as shown in Task Manager's Details tab) = mode.
;   2 = capture mode (default): nothing runs in the game; its window is captured and shown
;       converted on top (windowed/borderless only, about one frame of extra latency)
;   1 = injected mode (opt-in): converts inside the game (lowest latency, exclusive fullscreen works)
; Add and switch them from the tray icon (Games), or with:
;   OpenHDR.exe --add-game game.exe     /     OpenHDR.exe --add-game-injected game.exe
[Games]
